{% extends "base.html" %}
{% block titulo %}Recuperar contraseña - GameCoins Store{% endblock %}

{% block contenido %}
<section class="gcs-form-wrap">
    <form method="POST" class="gcs-form">
        <img src="{{ url_for('static', filename='img/logo-simple.jpeg') }}" alt="GameCoins Store" class="gcs-form-logo">
        <h1>Recuperar contraseña</h1>
        <p class="gcs-form-subtitulo">Escribe el correo de tu cuenta y te enviaremos un código de 6 números.</p>

        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required autofocus>

        <button type="submit" class="gcs-btn gcs-btn-primario gcs-btn-ancho">Enviar código</button>

        <p class="gcs-form-alterna">
            ¿Ya la recordaste? <a href="{{ url_for('login') }}">Iniciar sesión</a>
        </p>
    </form>
</section>
{% endblock %}

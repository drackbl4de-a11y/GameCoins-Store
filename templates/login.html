{% extends "base.html" %}
{% block titulo %}Iniciar sesión - GameCoins Store{% endblock %}

{% block contenido %}
<section class="gcs-form-wrap">
    <form method="POST" class="gcs-form">
        <img src="{{ url_for('static', filename='img/logo-simple.jpeg') }}" alt="GameCoins Store" class="gcs-form-logo">
        <h1>Iniciar sesión</h1>
        <p class="gcs-form-subtitulo">Bienvenido de nuevo a GameCoins Store</p>

        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required autofocus>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required>

        <a href="{{ url_for('recuperar_contrasena') }}" class="gcs-link-secundario">¿Olvidaste la contraseña?</a>

        <button type="submit" class="gcs-btn gcs-btn-primario gcs-btn-ancho">Iniciar sesión</button>

        <p class="gcs-form-alterna">
            ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a>
        </p>
    </form>
</section>
{% endblock %}
